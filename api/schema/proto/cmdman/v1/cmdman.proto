syntax = "proto3";

package cmdman.v1;

import "google/protobuf/timestamp.proto";

service CommandMonitorService {
  // Exchange stdin and resize requests for command output and PTY size events.
  rpc Attach(stream AttachRequest) returns (stream AttachResponse);

  // Stream the current log offset followed by live structured output records.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

  // Write the request's raw bytes to the command's standard input.
  rpc WriteStdin(WriteStdinRequest) returns (WriteStdinResponse);

  // Send the request's OS signal number to the command process group.
  rpc Signal(SignalRequest) returns (SignalResponse);

  // Stop the command and prevent restart policy from re-spawning it
  rpc Stop(StopRequest) returns (StopResponse);

  // Return the monitor's current state, exit code, command PID, and the
  // runtime state of the current run.
  rpc Status(StatusRequest) returns (StatusResponse);

  // Stream the runtime state: the current one first, then one message per
  // change. Title changes are debounced monitor-side.
  rpc WatchRuntimeState(WatchRuntimeStateRequest) returns (stream WatchRuntimeStateResponse);

  // Set the status the command reports about itself, replacing any previous
  // one. It lives only for the current run.
  rpc SetReportedStatus(SetReportedStatusRequest) returns (SetReportedStatusResponse);

  // Return the status the command last reported about itself.
  rpc GetReportedStatus(GetReportedStatusRequest) returns (GetReportedStatusResponse);

  // Clear the status the command reported about itself.
  rpc DeleteReportedStatus(DeleteReportedStatusRequest) returns (DeleteReportedStatusResponse);

  // Capture a snapshot of the command's terminal screen.
  rpc CaptureScreen(CaptureScreenRequest) returns (CaptureScreenResponse);
}

message AttachRequest {
  oneof input {
    bytes stdin = 1; // raw command input
    ResizeEvent resize = 2; // new PTY dimensions
  }
}

message AttachResponse {
  bytes stdout = 1; // raw command output
  // resize reports the command's current PTY window size. The monitor sends it
  // once when a client attaches (and whenever the PTY is resized) so a read-only
  // viewer can size its local terminal emulator to match the command's actual
  // render width without resizing the remote PTY.
  ResizeEvent resize = 2;
}

message ResizeEvent {
  uint32 rows = 1;
  uint32 cols = 2;
}

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
}

message LogLine {
  google.protobuf.Timestamp time = 1;
  LogStream stream = 2;
  bool partial = 3;
  bytes line = 4;
}

message SubscribeRequest {}

message SubscribeResponse {
  oneof event {
    SubscribeOffset offset = 1;
    LogLine line = 2;
  }
}

message SubscribeOffset {
  string driver = 1;
  bytes offset = 2;
}

message WriteStdinRequest {
  bytes stdin = 1;
}

message WriteStdinResponse {}

message SignalRequest {
  int32 signal = 1; // e.g. 15 for SIGTERM
}

message SignalResponse {}

message StopRequest {
  int32 signal = 1; // e.g. 15 for SIGTERM
}

message StopResponse {}

message StatusRequest {}

message StatusResponse {
  string state = 1; // starting, running, exited, failed
  int32 exit_code = 2;
  int32 pid = 3;
  RuntimeState runtime_state = 4;
}

// ReportedStatus is the vocabulary a command uses to report its own progress.
enum ReportedStatus {
  REPORTED_STATUS_UNSPECIFIED = 0; // nothing reported
  REPORTED_STATUS_WORKING = 1;
  REPORTED_STATUS_WAITING = 2;
  REPORTED_STATUS_DONE = 3;
}

// RuntimeState is what the monitor knows about the current run beyond the
// process state: what the command told about itself through its output (title,
// bell) or through the status RPCs. It is per-run - a restart clears it - and
// the same message is carried by both Status and WatchRuntimeState so one-shot
// and streaming consumers never diverge.
message RuntimeState {
  string title = 1; // window title the command last set, "" if it set none
  ReportedStatus status = 2;
  string detail = 3; // free-form detail accompanying status
  bool bell_unread = 4; // a bell rang and nobody has looked at the command since
  // cwd is the command's reported working directory as an absolute path,
  // parsed from its OSC 7 report or seeded from the configured dir. It is
  // empty when unknown.
  string cwd = 5;
}

message WatchRuntimeStateRequest {}

message WatchRuntimeStateResponse {
  RuntimeState state = 1;
}

message SetReportedStatusRequest {
  ReportedStatus status = 1;
  string detail = 2; // replaces the previous detail; empty clears it
}

message SetReportedStatusResponse {}

message GetReportedStatusRequest {}

message GetReportedStatusResponse {
  ReportedStatus status = 1;
  string detail = 2;
}

message DeleteReportedStatusRequest {}

message DeleteReportedStatusResponse {}

message CaptureScreenRequest {
  bool escapes = 1; // include SGR escape sequences (tmux -e)
  bool alt_screen = 2; // tmux -a
  bool quiet = 3; // tmux -q
  bool preserve_trailing_spaces = 4; // tmux -N
  // Line range (tmux -S/-E): 0 = first visible row; negative = history.
  // has_* distinguishes unset; *_extreme encodes tmux's literal '-'.
  bool has_start = 5;
  sint32 start_line = 6;
  bool start_extreme = 7; // start of history
  bool has_end = 8;
  sint32 end_line = 9;
  bool end_extreme = 10; // end of visible screen
}

message CaptureScreenResponse {
  bytes content = 1; // captured lines joined with \n, trailing \n included
}
